[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "gideon_core"
version = "1.0.0"
requires-python = ">=3.9"
description = "GideonEngine Rust core — concurrent, memory-safe orchestration for Poema"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# The Python module name exposed after `import gideon_core`
module-name = "gideon_core"
# Use abi3 wheel (works with Python 3.9+)
features = ["pyo3/extension-module"]
